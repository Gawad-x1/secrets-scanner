name: Secrets Scan
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # كل اثنين 3 الفجر
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # لازم عشان فحص التاريخ
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner
        run: python secrets_scanner.py . --history --json report.json --html report.html --sarif results.sarif --fail-on high
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-report
          path: |
            report.json
            report.html
      - name: Upload to GitHub Code Scanning
        if: always()
        continue-on-error: true   # بيشتغل على ريبو عام أو لو GitHub Advanced Security مفعّل
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
